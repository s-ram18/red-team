<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="33%" stop-color="#f59e0b"/>
      <stop offset="66%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Keyboard Chassis -->
  <rect x="100" y="120" width="400" height="160" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="110" y="130" width="380" height="140" rx="10" fill="#0f172a"/>
  <!-- Keys Grid -->
  <g fill="#334155" stroke="url(#rgb)" stroke-width="2" rx="4">
    <!-- Row 1 -->
    <rect x="130" y="145" width="25" height="25" rx="4"/>
    <rect x="160" y="145" width="25" height="25" rx="4"/>
    <rect x="190" y="145" width="25" height="25" rx="4"/>
    <rect x="220" y="145" width="25" height="25" rx="4"/>
    <rect x="250" y="145" width="25" height="25" rx="4"/>
    <rect x="280" y="145" width="25" height="25" rx="4"/>
    <rect x="310" y="145" width="25" height="25" rx="4"/>
    <rect x="340" y="145" width="25" height="25" rx="4"/>
    <rect x="370" y="145" width="25" height="25" rx="4"/>
    <rect x="400" y="145" width="60" height="25" rx="4"/>
    <!-- Row 2 -->
    <rect x="130" y="175" width="35" height="25" rx="4"/>
    <rect x="170" y="175" width="25" height="25" rx="4"/>
    <rect x="200" y="175" width="25" height="25" rx="4"/>
    <rect x="230" y="175" width="25" height="25" rx="4"/>
    <rect x="260" y="175" width="25" height="25" rx="4"/>
    <rect x="290" y="175" width="25" height="25" rx="4"/>
    <rect x="320" y="175" width="25" height="25" rx="4"/>
    <rect x="350" y="175" width="25" height="25" rx="4"/>
    <rect x="380" y="175" width="80" height="25" rx="4"/>
    <!-- Spacebar Row -->
    <rect x="130" y="205" width="45" height="25" rx="4"/>
    <rect x="180" y="205" width="40" height="25" rx="4"/>
    <rect x="225" y="205" width="140" height="25" rx="4" fill="url(#rgb)"/>
    <rect x="370" y="205" width="40" height="25" rx="4"/>
    <rect x="415" y="205" width="45" height="25" rx="4"/>
  </g>
  <text x="300" y="320" font-family="sans-serif" font-size="16" font-weight="bold" fill="#06b6d4" text-anchor="middle">AES-128 ENCRYPTED KEYBOARD</text>
</svg>
