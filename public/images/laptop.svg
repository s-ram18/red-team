<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Laptop Screen Outer -->
  <rect x="150" y="70" width="300" height="190" rx="12" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Screen Inner Display -->
  <rect x="160" y="80" width="280" height="170" rx="6" fill="url(#screenGrad)"/>
  <!-- Code on Screen -->
  <path d="M180 110 L230 110 M180 130 L280 130 M180 150 L250 150 M180 170 L300 170" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="380" cy="140" r="30" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="10 5"/>
  <path d="M370 140 L380 150 L395 130" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cyber Shield Badge on Display -->
  <text x="300" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">CYBERSHIELD PRO</text>
  <!-- Laptop Base -->
  <path d="M110 260 L490 260 L510 280 L90 280 Z" fill="#334155"/>
  <rect x="230" y="280" width="140" height="6" rx="3" fill="#06b6d4"/>
  <!-- Neon Underglow -->
  <ellipse cx="300" cy="290" rx="200" ry="8" fill="url(#neon)" opacity="0.6"/>
</svg>
